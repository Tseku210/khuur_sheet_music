name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, so each page's "last updated" date is its own.
          fetch-depth: 0
      # Builds site/ (the link validator fails the build on a broken internal
      # link) and uploads it as the Pages artifact.
      - uses: withastro/action@v6
        with:
          path: ./site
          node-version: 24

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
