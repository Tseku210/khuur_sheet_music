name: Unit tests run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    # The oldest Flutter the package supports, and the newest stable, so a
    # deprecation in a new Flutter shows here before it reaches an app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: 3.47.5
            version: 3.47.5
          - flutter: newest stable
            version: ""

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Each suite runs even when one before it failed, so that one run
      # shows every failure.
      - name: Library unit tests
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Score model tests
        if: ${{ !cancelled() }}
        run: dart test
        working-directory: packages/score_model

      - name: Layout engine tests
        if: ${{ !cancelled() }}
        run: dart test
        working-directory: packages/score_layout

      - name: Example tests
        if: ${{ !cancelled() }}
        run: flutter test
        working-directory: example
