name: example
description: Example app for the khuur_sheet_music package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  khuur_sheet_music:
    path: ../
  material_ui: ^1.11.0

# The library depends on the two pure-Dart packages by version, for pub.dev.
# The example builds against the checkout instead.
dependency_overrides:
  khuur_score_layout:
    path: ../packages/khuur_score_layout
  khuur_score_model:
    path: ../packages/khuur_score_model

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/soundfonts/
