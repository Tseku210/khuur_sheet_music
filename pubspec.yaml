name: khuur_sheet_music
description: Sheet music for Flutter. A scrolling, editable view of a score, with an immutable score model, a layout engine and MIDI playback.
version: 0.6.0
repository: https://github.com/Tseku210/khuur_sheet_music
issue_tracker: https://github.com/Tseku210/khuur_sheet_music/issues
screenshots:
  - description: The opening of Für Elise, drawn by SheetView in the light theme.
    path: doc/hero.png
  - description: The same sheet in the dark theme, in colours SheetPalette takes from it.
    path: doc/hero-dark.png
topics:
  - music
  - sheet-music
  - music-notation
  - midi
  - widget

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

workspace:
  - packages/khuur_score_layout
  - packages/khuur_score_model

dependencies:
  flutter:
    sdk: flutter
  khuur_score_layout: ^0.6.0
  khuur_score_model: ^0.6.0
  khuur_synth: ^0.2.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.38.1

flutter:
  assets:
    - fonts/OFL.txt
  fonts:
    - family: Bravura
      fonts:
        - asset: fonts/Bravura.otf
