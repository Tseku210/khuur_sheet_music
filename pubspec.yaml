name: khuur_sheet_music
description: Sheet music for Flutter. A scrolling, editable view of a score, with an immutable score model, a layout engine and MIDI playback.
version: 0.2.1
publish_to: none
homepage: https://github.com/Tseku210/khuur_sheet_music

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

workspace:
  - packages/khuur_score_layout
  - packages/khuur_score_model

dependencies:
  flutter:
    sdk: flutter
  khuur_score_layout:
    path: packages/khuur_score_layout
  khuur_score_model:
    path: packages/khuur_score_model
  khuur_synth: ^0.1.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.38.1

flutter:
  assets:
    - fonts/OFL.txt
  fonts:
    - family: Bravura
      fonts:
        - asset: fonts/Bravura.otf
